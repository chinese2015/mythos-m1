<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mythos · 代码工作区</title><link rel="stylesheet" href="/mythos/coding/styles.css"><script type="module" src="/mythos/coding/app.js"></script></head>
<body class="main-coding"><div class="app"><header><a class="brand" href="/mythos/">A</a><div><strong>代码工作区</strong><small>文件 · Diff · Agent · 运行</small></div><span class="badge">文件只读</span><select id="tasks" aria-label="切换任务"></select><button id="retry-task">重新加载</button><button id="reset">重置布局</button></header>
<div class="boundary"><a id="overview" href="/mythos/">任务概览 ↗</a><span id="task-context">正在读取任务…</span><a id="native-link" target="_blank" rel="noopener">完整 DSH ↗</a></div><div id="notice" class="notice" role="status" hidden></div>
<main><aside><div class="section-title">文件</div><div id="tree"></div></aside><div class="divider vertical" id="tree-divider" role="separator" tabindex="0" aria-label="调整文件区宽度" aria-orientation="vertical"></div>
<section class="workspace"><div class="tabs"><button id="code-tab" class="active">代码</button><button id="diff-tab">任务 Diff</button><span id="filename">选择文件</span><button id="quote" disabled>引用选区 →</button><button id="reload-file" title="重新读取当前文件">↻</button></div><div class="file-info" id="file-info">正在准备只读文件视图…</div><div class="code" id="code"><pre id="gutter" aria-hidden="true"></pre><textarea id="source" aria-label="任务源码，只读" readonly spellcheck="false"></textarea></div><pre id="diff" hidden></pre>
<div class="divider horizontal" id="log-divider" role="separator" tabindex="0" aria-label="调整运行面板高度" aria-orientation="horizontal"></div><section class="logs" id="monitor" aria-label="任务运行监控"></section></section>
<div class="divider vertical" id="agent-divider" role="separator" tabindex="0" aria-label="调整 Agent 区宽度" aria-orientation="vertical"></div><section class="agent"><div class="section-title">Agent <span id="bridge-status">等待会话</span></div><div class="session" id="session"></div><iframe id="native" title="原生任务会话"></iframe></section></main>
<footer><span id="status">正在读取任务</span><span>文件查看与引用不执行命令；发送消息遵循任务当前权限</span></footer></div></body></html>
